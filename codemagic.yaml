workflows:
  android-apk:
    name: AFG AI Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Configure Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "Java:"
          java -version
          echo "Android SDK: $ANDROID_SDK_ROOT"
      - name: Install Gradle and build APK
        script: |
          set -euo pipefail
          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            GRADLE_VERSION="8.9"
            curl --fail --location --retry 3 "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" --output /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-${GRADLE_VERSION}/bin/gradle --no-daemon assembleDebug
          fi
    artifacts:
      - app/build/outputs/**/*.apk
      - build/outputs/**/*.apk
